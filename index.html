const PROXY = "https://raceanalyser.didier-b9a.workers.dev/";
const DEFAULT_RACE_ID = 1370;

// ── Helpers ───────────────────────────────────────────────────────────────────
function toSec(t){if(!t)return null;const p=t.split(":").map(Number);return p[0]*3600+p[1]*60+(p[2]||0);}
function fmt(s){if(s==null)return"—";const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return`${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;}
function fmtMin(s){if(s==null)return"—";const m=Math.floor(s/60),ss=s%60;return`${m}:${String(ss).padStart(2,"0")}`;}
const FLAGS={ZA:"🇿🇦",GB:"🇬🇧",ZW:"🇿🇼",NL:"🇳🇱",LV:"🇱🇻",NA:"🇳🇦",IE:"🇮🇪",BE:"🇧🇪",BR:"🇧🇷"};

// ── Storage ───────────────────────────────────────────────────────────────────
function dbKey(id){return`race_v4_${id}`;}
function elevKey(id){return`elev_v1_${id}`;}
function dbSave(id,data){try{localStorage.setItem(dbKey(id),JSON.stringify(data));}catch{}}
function dbLoad(id){try{const v=localStorage.getItem(dbKey(id));return v?JSON.parse(v):null;}catch{return null;}}
function dbClear(id){try{localStorage.removeItem(dbKey(id));}catch{}}
function elevSave(id,data){try{localStorage.setItem(elevKey(id),JSON.stringify(data));}catch{}}
function elevLoad(id){try{const v=localStorage.getItem(elevKey(id));return v?JSON.parse(v):null;}catch{return null;}}
function profileKey(id){return `race_profile_${id}`;}
function profileSave(id,data){try{localStorage.setItem(profileKey(id),JSON.stringify(data));}catch{}}
function profileLoad(id){try{const v=localStorage.getItem(profileKey(id));return v?JSON.parse(v):null;}catch{return null;}}
function calcSectionStats(profile,fromDist,toDist){
  if(!profile?.length)return null;
  const pts=profile.filter(p=>p.distance>=fromDist&&p.distance<=toDist);
  if(pts.length<2)return null;
  let gain=0,loss=0;
  for(let i=1;i<pts.length;i++){const d=pts[i].elevation-pts[i-1].elevation;if(d>0)gain+=d;else loss-=d;}
  return{gain:Math.round(gain),loss:Math.round(loss)};
}
function parseElev(str){const n=parseFloat((str||"").replace(/[^\d.]/g,""));return isNaN(n)?null:n;}

async function gql(query){
  const res=await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query})});
  return res.json();
}

// ── Sub-components ────────────────────────────────────────────────────────────
function RankBadge({rank,total}){
  const p=rank/total,c=p<=0.25?"#22c55e":p<=0.5?"#eab308":"#ef4444";
  return <span style={{display:"inline-block",width:22,height:22,lineHeight:"22px",textAlign:"center",borderRadius:"50%",background:`${c}18`,border:`1px solid ${c}40`,color:c,fontFamily:"JetBrains Mono,monospace",fontSize:10,fontWeight:700}}>{rank}</span>;
}

function Spinner(){
  return <div className="spin" style={{width:12,height:12,border:"2px solid #638EB0",borderTopColor:"transparent",borderRadius:"50%",display:"inline-block"}}/>;
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const [raceId,setRaceId]       = useState(null);
  const [raceInput,setRaceInput] = useState("");
  const [topN,setTopN]           = useState(25);
  const [phase,setPhase]         = useState("done");
  const [phaseMsg,setPhaseMsg]   = useState("");
  const [progress,setProgress]   = useState(0);
  const [total,setTotal]         = useState(0);
  const [leaderboard,setLeaderboard] = useState([]);
  const [athletes,setAthletes]   = useState({});
  const [raceLabel,setRaceLabel] = useState("Pass2Pass Ultra Trail");
  const [tab,setTab]             = useState("shifts");
  const [errorMsg,setErrorMsg]   = useState("");
  // elevation: { [cpName]: metres }
  const [elevation,setElevation] = useState({});
  const [elevEditing,setElevEditing] = useState(false);
  const [elevDraft,setElevDraft] = useState({});
  const [courseProfile,setCourseProfile] = useState([]);
  const [cpDistances,setCpDistances] = useState({});

  const loadRace = useCallback(async(id,n,force=false)=>{
    setPhase("leaderboard");setPhaseMsg("Fetching leaderboard…");
    setProgress(0);setTotal(0);setLeaderboard([]);setAthletes({});setErrorMsg("");

    if(!force){
      const cached=dbLoad(id);
      if(cached?.leaderboard?.length&&Object.keys(cached.athletes||{}).length>0){
        setLeaderboard(cached.leaderboard);setAthletes(cached.athletes);
        setRaceLabel(cached.label||`Race ${id}`);
        let elev=elevLoad(id);
        let prof=profileLoad(id);
        if(!elev||!prof?.length){try{const r=await gql(`query{race(id:${id}){checkpoints{name elevation distance} profile{distance elevation}}}`);if(!elev){const ae={};(r?.data?.race?.checkpoints||[]).forEach(cp=>{const n=parseElev(cp.elevation);if(n!=null&&cp.name)ae[cp.name.toUpperCase()]=n;});if(Object.keys(ae).length>=2){elev=ae;elevSave(id,ae);}}const newProf=r?.data?.race?.profile||[];if(!prof?.length&&newProf.length){prof=newProf;profileSave(id,prof);}const cpDist={};(r?.data?.race?.checkpoints||[]).forEach(cp=>{if(cp.name&&cp.distance!=null)cpDist[cp.name.toUpperCase()]=cp.distance;});if(Object.keys(cpDist).length)setCpDistances(cpDist);}catch{}}
        if(elev)setElevation(elev);
        if(prof?.length)setCourseProfile(prof);
        setPhase("done");return;
      }
    }

    let lb;
    let raceName=null;
    try{
      const res=await gql(`query { race(id: ${id}) { name testLeaderboard { id firstName lastName category gender countryCode } } }`);
      lb=res?.data?.race?.testLeaderboard;
      raceName=res?.data?.race?.name||null;
      if(!lb?.length)throw new Error("Empty leaderboard — check race ID");
    }catch(e){setErrorMsg(e.message);setPhase("error");return;}

    const top=lb.slice(0,n||lb.length).map((a,i)=>({...a,overallPosition:i+1}));
    setLeaderboard(top);setTotal(top.length);
    setPhase("athletes");setPhaseMsg(`Fetching ${top.length} athlete splits…`);

    const amap={};
    for(let i=0;i<top.length;i++){
      try{
        const res=await gql(`query { athlete(id: ${top[i].id}) { id firstName lastName category gender countryCode overallPosition checkpoints { name elapsedTime order distance position } } }`);
        const a=res?.data?.athlete;
        if(a)amap[top[i].id]=a;
      }catch{}
      setProgress(i+1);
      await new Promise(r=>setTimeout(r,80));
    }

    const label=raceName||`Race ${id}`;
    setAthletes(amap);setRaceLabel(label);setPhase("done");
    dbSave(id,{leaderboard:top,athletes:amap,label});
    let elev=elevLoad(id);
    let prof=profileLoad(id);
    if(!elev||!prof?.length){try{const r=await gql(`query{race(id:${id}){checkpoints{name elevation distance} profile{distance elevation}}}`);if(!elev){const ae={};(r?.data?.race?.checkpoints||[]).forEach(cp=>{const n=parseElev(cp.elevation);if(n!=null&&cp.name)ae[cp.name.toUpperCase()]=n;});if(Object.keys(ae).length>=2){elev=ae;elevSave(id,ae);}}const newProf=r?.data?.race?.profile||[];if(!prof?.length&&newProf.length){prof=newProf;profileSave(id,prof);}const cpDist={};(r?.data?.race?.checkpoints||[]).forEach(cp=>{if(cp.name&&cp.distance!=null)cpDist[cp.name.toUpperCase()]=cp.distance;});if(Object.keys(cpDist).length)setCpDistances(cpDist);}catch{}}
    if(elev)setElevation(elev);
    if(prof?.length)setCourseProfile(prof);
  },[]);

  // No auto-load — start on landing page

  function handleLoad(){const id=parseInt(raceInput,10);if(!id)return;setRaceId(id);setElevation({});setCourseProfile([]);setCpDistances({});loadRace(id,topN);}
  function handleRefresh(){dbClear(raceId);loadRace(raceId,topN,true);}
  function handleHome(){setRaceId(null);setRaceInput("");setAthletes({});setLeaderboard([]);setElevation({});setCourseProfile([]);setCpDistances({});setPhase("done");setRaceLabel("Pass2Pass Ultra Trail");}

  // ── Ordered athletes with cpMap ──────────────────────────────────────────
  const orderedAthletes=useMemo(()=>
    leaderboard.filter(e=>athletes[e.id]).map(e=>{
      const a=athletes[e.id],cpMap={};
      (a.checkpoints||[]).forEach(cp=>{cpMap[cp.name?.toUpperCase()]=cp;});
      return{...a,pos:e.overallPosition,cpMap};
    }),[leaderboard,athletes]);

  // ── Checkpoints sorted by order ─────────────────────────────────────────
  const checkpoints=useMemo(()=>{
    const map={};
    orderedAthletes.forEach(a=>Object.values(a.cpMap).forEach(cp=>{
      const k=cp.name?.toUpperCase();
      if(!map[k])map[k]={...cp,name:cp.name?.toUpperCase()};
    }));
    return Object.values(map).sort((a,b)=>(a.order||0)-(b.order||0));
  },[orderedAthletes]);

  // ── Halfway = middle checkpoint ──────────────────────────────────────────
  const halfwayCp=useMemo(()=>{
    if(!checkpoints.length)return null;
    const candidates=checkpoints.filter(cp=>cp.name!=="START"&&cp.name!=="FINISH");
    if(!candidates.length)return checkpoints[Math.floor(checkpoints.length/2)];
    const finish=checkpoints.find(cp=>cp.name==="FINISH");
    const totalDist=finish?.distance??checkpoints[checkpoints.length-1]?.distance;
    if(totalDist){
      const half=Number(totalDist)/2;
      return candidates.reduce((best,cp)=>Math.abs(Number(cp.distance)-half)<Math.abs(Number(best.distance)-half)?cp:best);
    }
    return candidates[Math.floor(candidates.length/2)];
  },[checkpoints]);

  // ── Split data ──────────────────────────────────────────────────────────
  const splitData=useMemo(()=>{
    if(!halfwayCp)return[];
    return orderedAthletes.map(a=>{
      const halfCp=a.cpMap[halfwayCp.name];
      const finCp=a.cpMap["FINISH"];
      const startCp=a.cpMap["START"];
      const half1=halfCp?.elapsedTime?toSec(halfCp.elapsedTime):null;
      const total=finCp?.elapsedTime?toSec(finCp.elapsedTime):null;
      const half2=(half1!=null&&total!=null)?total-half1:null;
      const ratio=(half1&&half2)?half2/half1:null;
      const halfPos=halfCp?.position;
      const finPos=a.pos;
      const posDelta=(halfPos!=null&&finPos!=null)?halfPos-finPos:null;
      return{...a,half1,half2,total,ratio,halfPos,finPos,posDelta};
    }).filter(a=>a.half1&&a.half2);
  },[orderedAthletes,halfwayCp]);

  const byH1=useMemo(()=>[...splitData].sort((a,b)=>a.half1-b.half1),[splitData]);
  const byH2=useMemo(()=>[...splitData].sort((a,b)=>a.half2-b.half2),[splitData]);
  const byRatio=useMemo(()=>[...splitData].sort((a,b)=>a.ratio-b.ratio),[splitData]);

  // ── Segment data (elevation-aware) ──────────────────────────────────────
  // For each consecutive checkpoint pair, compute per-athlete:
  // - segment time (s)
  // - distance (km)
  // - elevation gain (m) from user input
  // - pace (min/km)
  // - VAM (m/h) if climbing segment
  const segments=useMemo(()=>{
    if(checkpoints.length<2)return[];
    const segs=[];
    for(let i=1;i<checkpoints.length;i++){
      const from=checkpoints[i-1],to=checkpoints[i];
      const dist=(to.distance!=null&&from.distance!=null)?(Number(to.distance)-Number(from.distance))/1000:null;
      const elevFrom=elevation[from.name]??null;
      const elevTo=elevation[to.name]??null;
      const fromDist=from.distance!=null?Number(from.distance):null;
      const toDist=to.distance!=null?Number(to.distance):null;
      const profileStats=(courseProfile.length&&fromDist!=null&&toDist!=null)?calcSectionStats(courseProfile,fromDist,toDist):null;
      const elevGain=profileStats!=null?profileStats.gain:(elevFrom!=null&&elevTo!=null)?Math.max(0,elevTo-elevFrom):null;
      const elevLoss=profileStats!=null?profileStats.loss:(elevFrom!=null&&elevTo!=null)?Math.max(0,elevFrom-elevTo):null;
      const totalVert=(elevGain!=null&&elevLoss!=null)?(elevGain+elevLoss):null;
      const isClimb=totalVert!=null&&totalVert>0&&(elevGain/totalVert)>0.55;
      segs.push({from:from.name,to:to.name,dist,elevGain,elevLoss,isClimb,
        athletes:orderedAthletes.map(a=>{
          const tFrom=a.cpMap[from.name]?.elapsedTime;
          const tTo=a.cpMap[to.name]?.elapsedTime;
          const segTime=(tFrom&&tTo)?toSec(tTo)-toSec(tFrom):null;
          const pace=(segTime&&dist)?segTime/dist:null; // s/km
          const vam=(segTime&&elevGain&&elevGain>20)?(elevGain/(segTime/3600)):null; // m/h
          return{...a,segTime,pace,vam};
        }).filter(a=>a.segTime>0)
      });
    }
    return segs;
  },[checkpoints,orderedAthletes,elevation,courseProfile,cpDistances]);

  // ── Athlete climbing score ───────────────────────────────────────────────
  // Average rank on climbing segments vs descending segments
  const athleteProfiles=useMemo(()=>{
    const climbSegs=segments.filter(s=>s.isClimb&&s.elevGain>20);
    const descSegs=segments.filter(s=>!s.isClimb&&s.elevLoss>20);
    if(!climbSegs.length&&!descSegs.length)return[];
    function segMedian(seg){
      const paces=seg.athletes.filter(x=>x.pace).map(x=>x.pace).sort((a,b)=>a-b);
      if(!paces.length)return null;
      const m=Math.floor(paces.length/2);
      return paces.length%2?paces[m]:(paces[m-1]+paces[m])/2;
    }
    return orderedAthletes.map(a=>{
      let climbRanks=[];
      climbSegs.forEach(seg=>{
        const ranked=[...seg.athletes].filter(x=>x.pace!=null).sort((x,y)=>x.pace-y.pace);
        const ri=ranked.findIndex(x=>x.id===a.id);
        if(ri>=0)climbRanks.push(ri+1); // rank 1=fastest, lower=better
      });
      let descRanks=[];
      descSegs.forEach(seg=>{
        const ranked=[...seg.athletes].filter(x=>x.pace!=null).sort((x,y)=>x.pace-y.pace);
        const ri=ranked.findIndex(x=>x.id===a.id);
        if(ri>=0)descRanks.push(ri+1);
      });
      const avgClimb=climbRanks.length?climbRanks.reduce((s,v)=>s+v,0)/climbRanks.length:null;
      const avgDesc=descRanks.length?descRanks.reduce((s,v)=>s+v,0)/descRanks.length:null;
      // positive profile = climbs better relative to descents (lower rank = better, so avgDesc-avgClimb)
      const profile=(avgClimb!=null&&avgDesc!=null)?avgDesc-avgClimb:null;
      return{...a,avgClimb,avgDesc,profile,climbCount:climbRanks.length,descCount:descRanks.length};
    }).filter(a=>a.profile!=null).sort((a,b)=>b.profile-a.profile);
  },[segments,orderedAthletes]);

  // ── Elevation editor ─────────────────────────────────────────────────────
  function openElevEditor(){
    const draft={};
    checkpoints.forEach(cp=>{draft[cp.name]=elevation[cp.name]??""});
    setElevDraft(draft);setElevEditing(true);
  }
  function saveElev(){
    const parsed={};
    Object.entries(elevDraft).forEach(([k,v])=>{const n=parseFloat(v);if(!isNaN(n))parsed[k]=n;});
    setElevation(parsed);elevSave(raceId,parsed);setElevEditing(false);
  }

  const loadedCount=Object.keys(athletes).length;
  const isLoading=phase==="leaderboard"||phase==="athletes";
  const hasElev=Object.keys(elevation).length>=2;

  const cumulativeGain=useMemo(()=>{
    const res={};let gain=0;
    checkpoints.forEach((cp,i)=>{
      if(i===0){res[cp.name]=0;return;}
      const prev=checkpoints[i-1];
      const fromDist=cpDistances[prev.name]??null;
      const toDist=cpDistances[cp.name]??null;
      const profileStats=(courseProfile.length&&fromDist!=null&&toDist!=null)?calcSectionStats(courseProfile,fromDist,toDist):null;
      if(profileStats!=null){gain+=profileStats.gain;}
      else{const a=elevation[prev.name]??null,b=elevation[cp.name]??null;if(a!=null&&b!=null)gain+=Math.max(0,b-a);}
      res[cp.name]=gain;
    });
    return res;
  },[checkpoints,elevation,courseProfile,cpDistances]);

  const sectionGains=useMemo(()=>{
    const res={};
    for(let i=1;i<checkpoints.length;i++){
      const from=checkpoints[i-1],to=checkpoints[i];
      const fromDist=cpDistances[from.name]??null;
      const toDist=cpDistances[to.name]??null;
      if(courseProfile.length&&fromDist!=null&&toDist!=null){
        const stats=calcSectionStats(courseProfile,fromDist,toDist);
        if(stats)res[to.name]=stats;
      }
    }
    return res;
  },[checkpoints,courseProfile,cpDistances]);

  const S={
    header:{background:"linear-gradient(135deg,#03365A,#050e1c)",borderBottom:"1px solid #091828",padding:"18px 28px"},
    hWrap:{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:14,maxWidth:1400,margin:"0 auto"},
    hlabel:{fontFamily:"Barlow Condensed,sans-serif",fontSize:10,letterSpacing:"0.2em",color:"#638EB0",marginBottom:4},
    htitle:{fontFamily:"Barlow Condensed,sans-serif",fontSize:30,fontWeight:900,letterSpacing:"0.06em",color:"#fff",lineHeight:1},
    pill:{background:"#070f1e",border:"1px solid #0f1e30",borderRadius:8,padding:"8px 14px",textAlign:"center",display:"flex",flexDirection:"column",gap:2},
    btn:{fontFamily:"Barlow Condensed,sans-serif",fontSize:12,fontWeight:700,letterSpacing:"0.1em",background:"#638EB0",color:"#fff",border:"none",borderRadius:4,padding:"6px 14px",cursor:"pointer"},
    btnSm:{fontFamily:"Barlow Condensed,sans-serif",fontSize:11,fontWeight:700,letterSpacing:"0.08em",background:"transparent",color:"#334155",border:"1px solid #1e3a5f",borderRadius:4,padding:"4px 10px",cursor:"pointer"},
    inp:{background:"#040b16",border:"1px solid #0f1e30",borderRadius:4,color:"#94a3b8",fontFamily:"JetBrains Mono,monospace",fontSize:11,padding:"5px 8px"},
    tabBar:{display:"flex",borderBottom:"1px solid #091828",padding:"0 28px",background:"#060d18",overflowX:"auto"},
    tabBtn:(a)=>({fontFamily:"Barlow Condensed,sans-serif",fontSize:12,fontWeight:700,letterSpacing:"0.12em",padding:"12px 18px",background:"transparent",border:"none",borderBottom:a?"2px solid #638EB0":"2px solid transparent",color:a?"#e2e8f0":"#334155",cursor:"pointer",whiteSpace:"nowrap"}),
    content:{maxWidth:1400,margin:"0 auto",padding:"18px 28px"},
    desc:{fontSize:12,color:"#334155",marginBottom:14,lineHeight:1.6},
    tableWrap:{overflowX:"auto",borderRadius:8,border:"1px solid #091828"},
    table:{width:"100%",borderCollapse:"collapse",fontSize:11},
    th:{background:"#060d18",color:"#1e3a5f",fontFamily:"Barlow Condensed,sans-serif",fontSize:10,fontWeight:700,letterSpacing:"0.1em",padding:"8px 9px",textAlign:"center",borderBottom:"1px solid #0a1828",whiteSpace:"nowrap",position:"sticky",top:0,zIndex:1},
    s0:{position:"sticky",left:0,zIndex:2,background:"#060d18",boxShadow:"2px 0 4px rgba(0,0,0,0.4)"},
    s1:{position:"sticky",left:44,zIndex:2,background:"#060d18",boxShadow:"4px 0 8px rgba(0,0,0,0.5)"},
    td:{padding:"8px 9px",borderBottom:"1px solid #070f1c",verticalAlign:"middle"},
    chip:(pos)=>({display:"inline-block",width:24,height:24,lineHeight:"24px",textAlign:"center",borderRadius:4,fontFamily:"JetBrains Mono,monospace",fontWeight:700,fontSize:11,color:pos<=3?"#fbbf24":"#638EB0",background:pos<=3?"rgba(251,191,36,0.1)":"rgba(99,142,176,0.1)"}),
    card:{background:"#070f1e",border:"1px solid #0f1e30",borderRadius:8,padding:16},
    cardTitle:{fontFamily:"Barlow Condensed,sans-serif",fontSize:12,fontWeight:700,letterSpacing:"0.14em",color:"#334155",marginBottom:10},
    rankRow:{display:"flex",alignItems:"center",gap:7,padding:"6px 0",borderBottom:"1px solid #0a1828"},
    rankNum:{fontFamily:"Barlow Condensed,sans-serif",fontWeight:900,fontSize:15,minWidth:20,textAlign:"right"},
  };

  function AthleteCell({a}){
    return(
      <div style={{display:"flex",alignItems:"center",gap:5}}>
        <span style={{fontSize:13}}>{FLAGS[a.countryCode]||"🏃"}</span>
        <div>
          <div style={{fontWeight:700,fontSize:12,color:"#e2e8f0"}}>{a.lastName?.toUpperCase()}</div>
          <div style={{fontSize:9,color:"#334155"}}>{a.firstName}{a.category?` · ${a.category}`:""}</div>
        </div>
      </div>
    );
  }

  return(
    <div style={{background:"#040b16",minHeight:"100vh"}}>

      {/* HEADER */}
      <div style={S.header}>
        <div style={S.hWrap}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}><img src={LOGO_SRC} style={{width:42,height:42,borderRadius:"50%",flexShrink:0}}/><div style={S.hlabel}>ASCENT RUNNING · RACE INTELLIGENCE</div></div>
            <h1 style={S.htitle}>{raceLabel.toUpperCase()}</h1>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
              <input value={raceInput} onChange={e=>setRaceInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&handleLoad()} placeholder="Race ID" style={{...S.inp,width:90}}/>
              <select value={topN} onChange={e=>setTopN(Number(e.target.value))} style={S.inp}>
                {[[10,"Top 10"],[25,"Top 25"],[50,"Top 50"],[0,"All"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
              </select>
              <button onClick={handleLoad} style={S.btn}>LOAD</button>
              <button onClick={handleRefresh} style={S.btnSm} title="Force refresh">↻</button>
              <button onClick={handleHome} style={S.btnSm} title="Home">⌂</button>
            </div>
            <div style={S.pill}>
              <span style={{color:!isLoading&&loadedCount>0?"#22c55e":"#f59e0b",fontFamily:"JetBrains Mono,monospace",fontSize:18,fontWeight:700}}>
                {isLoading?progress:loadedCount}
              </span>
              <span style={{color:"#334155",fontSize:10,letterSpacing:"0.1em"}}>/{total||"—"} LOADED</span>
            </div>
          </div>
        </div>
      </div>

      {/* PROGRESS */}
      {isLoading&&(
        <div style={{background:"#060d18",borderBottom:"1px solid #091828"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 28px",fontSize:11,color:"#638EB0"}}>
            <Spinner/><span>{phaseMsg}</span>
            {total>0&&<span style={{fontFamily:"JetBrains Mono,monospace",fontSize:10,color:"#1e3a5f"}}>{progress}/{total}</span>}
          </div>
          {total>0&&<div style={{height:2,background:"#0a1828"}}>
            <div style={{height:"100%",width:`${(progress/total)*100}%`,background:"linear-gradient(90deg,#638EB0,#22c55e)",transition:"width .3s"}}/>
          </div>}
        </div>
      )}

      {phase==="error"&&(
        <div style={{padding:"20px 28px",color:"#ef4444",fontFamily:"JetBrains Mono,monospace",fontSize:12}}>
          ❌ {errorMsg} <button onClick={handleRefresh} style={{...S.btn,marginLeft:12,fontSize:10}}>RETRY</button>
        </div>
      )}

      {/* ELEVATION EDITOR MODAL */}
      {elevEditing&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"#070f1e",border:"1px solid #0f1e30",borderRadius:10,padding:28,width:380,maxHeight:"80vh",overflowY:"auto"}}>
            <div style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:16,fontWeight:700,letterSpacing:"0.1em",color:"#638EB0",marginBottom:4}}>CHECKPOINT ELEVATION</div>
            <div style={{fontSize:11,color:"#334155",marginBottom:16,lineHeight:1.6}}>Elevation (metres above sea level) is auto-fetched from the race API. Override values below if needed. Used to calculate VAM and identify true climbing vs descending segments.</div>
            {checkpoints.map(cp=>(
              <div key={cp.name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <span style={{flex:1,fontSize:11,color:"#94a3b8",fontFamily:"Barlow Condensed,sans-serif",letterSpacing:"0.05em"}}>{cp.name}{cp.distance?` (${(Number(cp.distance)/1000).toFixed(1)}km)`:""}</span>
                <input
                  type="number" placeholder="m asl"
                  value={elevDraft[cp.name]??""} 
                  onChange={e=>setElevDraft(d=>({...d,[cp.name]:e.target.value}))}
                  style={{...S.inp,width:90,textAlign:"right"}}
                />
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button onClick={saveElev} style={S.btn}>SAVE</button>
              <button onClick={()=>setElevEditing(false)} style={S.btnSm}>CANCEL</button>
            </div>
          </div>
        </div>
      )}

      {/* TABS */}
      {loadedCount>0&&(<>
        <div style={S.tabBar}>
          {[
            {k:"shifts",l:"LEADERBOARD SHIFTS"},
            {k:"splits",l:"SPLIT ANALYSIS"},
            {k:"segments",l:"SEGMENT ANALYSIS"},
          ].map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)} style={S.tabBtn(tab===t.k)}>{t.l}</button>
          ))}
        </div>

        <div style={S.content}>

          {/* ── LEADERBOARD SHIFTS ─────────────────────────────────────── */}
          {tab==="shifts"&&(
            <div className="fu">
              <p style={S.desc}>
                Position at each checkpoint for the top {loadedCount}. <span style={{color:"#22c55e"}}>▲</span> = moved up, <span style={{color:"#ef4444"}}>▼</span> = dropped.
                {halfwayCp&&<span style={{color:"#638EB0"}}> {halfwayCp.name} ★ = midpoint.</span>}
              </p>
              <div style={S.tableWrap}>
                <table style={S.table}>
                  <thead><tr>
                    <th style={{...S.th,...S.s0,minWidth:40}}>POS</th>
                    <th style={{...S.th,...S.s1,minWidth:155,textAlign:"left"}}>ATHLETE</th>
                    {checkpoints.map(cp=>{
                      const isH=halfwayCp&&cp.name===halfwayCp.name;
                      return(<th key={cp.name} style={{...S.th,minWidth:75,color:isH?"#638EB0":"#1e3a5f",borderBottom:isH?"2px solid #638EB0":"1px solid #0a1828"}}>
                        <div style={{fontSize:9}}>{isH?cp.name+" ★":cp.name}</div>
                        {cp.distance&&<div style={{fontSize:7,color:"#172a40",marginTop:1}}>{(Number(cp.distance)/1000).toFixed(1)}km</div>}
                        {elevation[cp.name]!=null&&<div style={{fontSize:7,color:"#1e3a5f",marginTop:1}}>{elevation[cp.name]}m asl</div>}
                        {sectionGains[cp.name]&&<div style={{fontSize:7,color:"#f97316",marginTop:1}}>↑{sectionGains[cp.name].gain}m ↓{sectionGains[cp.name].loss}m</div>}
                        {!sectionGains[cp.name]&&cumulativeGain[cp.name]>0&&<div style={{fontSize:7,color:"#f97316",marginTop:1}}>+{cumulativeGain[cp.name]}m↑</div>}
                      </th>);
                    })}
                  </tr></thead>
                  <tbody>
                    {orderedAthletes.map(a=>(
                      <tr key={a.id} className="row">
                        <td style={{...S.td,...S.s0,textAlign:"center"}}><span style={S.chip(a.pos)}>{a.pos}</span></td>
                        <td style={{...S.td,...S.s1}}><AthleteCell a={a}/></td>
                        {checkpoints.map((cp,ci)=>{
                          const cpd=a.cpMap[cp.name];
                          const prevCpd=ci>0?a.cpMap[checkpoints[ci-1].name]:null;
                          const curPos=cpd?.position,prevPos=prevCpd?.position;
                          const delta=(prevPos!=null&&curPos!=null)?prevPos-curPos:null;
                          const isH=halfwayCp&&cp.name===halfwayCp.name;
                          return(
                            <td key={cp.name} style={{...S.td,textAlign:"center",background:isH?"rgba(99,142,176,0.05)":"transparent",borderLeft:isH?"2px solid rgba(99,142,176,0.15)":"none",borderRight:isH?"2px solid rgba(99,142,176,0.15)":"none"}}>
                              {cpd?.elapsedTime?(
                                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                                  <span style={{padding:"2px 5px",borderRadius:3,fontFamily:"JetBrains Mono,monospace",fontWeight:700,fontSize:11,background:isH?"rgba(99,142,176,0.2)":"rgba(255,255,255,0.04)",color:isH?"#93c5fd":"#94a3b8"}}>{curPos||"—"}</span>
                                  {delta!==null&&delta!==0&&<span style={{fontSize:9,fontFamily:"JetBrains Mono,monospace",fontWeight:700,color:delta>0?"#22c55e":"#ef4444"}}>{delta>0?`▲${delta}`:`▼${Math.abs(delta)}`}</span>}
                                  <span style={{fontSize:8,color:"#1e3a5f",fontFamily:"JetBrains Mono,monospace"}}>{cpd.elapsedTime}</span>
                                </div>
                              ):<span style={{color:"#0f1e30",fontSize:10}}>—</span>}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── SPLIT ANALYSIS ─────────────────────────────────────────── */}
          {tab==="splits"&&(
            <div className="fu">
              <p style={S.desc}>
                First half vs second half split times, split at the midpoint checkpoint
                {halfwayCp?<strong style={{color:"#638EB0"}}> {halfwayCp.name}{halfwayCp.distance?` (${(Number(halfwayCp.distance)/1000).toFixed(1)}km)`:""}</strong>:""}
                . Ratio = 2nd half ÷ 1st half. Below 1.0 = negative split (faster second half).
              </p>
              {splitData.length===0?<div style={{color:"#f59e0b",padding:16,fontSize:12}}>No split data available for this race.</div>:(
                <div style={S.tableWrap}>
                  <table style={S.table}>
                    <thead><tr>
                      <th style={{...S.th,minWidth:40}}>POS</th>
                      <th style={{...S.th,minWidth:155,textAlign:"left"}}>ATHLETE</th>
                      <th style={{...S.th,minWidth:90,color:"#fb923c"}}>1ST HALF</th>
                      <th style={{...S.th,minWidth:48,color:"#fb923c"}}>RNK</th>
                      <th style={{...S.th,minWidth:90,color:"#4ade80"}}>2ND HALF</th>
                      <th style={{...S.th,minWidth:48,color:"#4ade80"}}>RNK</th>
                      <th style={{...S.th,minWidth:72}}>2H÷1H</th>
                      <th style={{...S.th,minWidth:105}}>MID→FIN POS</th>
                      <th style={{...S.th,minWidth:88}}>FINISH</th>
                    </tr></thead>
                    <tbody>
                      {splitData.map(a=>{
                        const r1=byH1.findIndex(x=>x.id===a.id)+1;
                        const r2=byH2.findIndex(x=>x.id===a.id)+1;
                        const rc=a.ratio<0.95?"#4ade80":a.ratio<1.0?"#86efac":a.ratio<1.08?"#fbbf24":"#f87171";
                        const pd=a.posDelta;
                        return(
                          <tr key={a.id} className="row">
                            <td style={{...S.td,textAlign:"center"}}><span style={S.chip(a.pos)}>{a.pos}</span></td>
                            <td style={S.td}><AthleteCell a={a}/></td>
                            <td style={{...S.td,textAlign:"center"}}>
                              <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:12,fontWeight:600,color:"#fb923c",background:"rgba(249,115,22,0.1)",padding:"2px 7px",borderRadius:4}}>{fmt(a.half1)}</span>
                            </td>
                            <td style={{...S.td,textAlign:"center"}}><RankBadge rank={r1} total={splitData.length}/></td>
                            <td style={{...S.td,textAlign:"center"}}>
                              <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:12,fontWeight:600,color:"#4ade80",background:"rgba(34,197,94,0.1)",padding:"2px 7px",borderRadius:4}}>{fmt(a.half2)}</span>
                            </td>
                            <td style={{...S.td,textAlign:"center"}}><RankBadge rank={r2} total={splitData.length}/></td>
                            <td style={{...S.td,textAlign:"center"}}>
                              <div style={{fontFamily:"JetBrains Mono,monospace",fontSize:13,fontWeight:700,color:rc}}>{a.ratio?.toFixed(3)}</div>
                              <div style={{fontSize:8,marginTop:1,color:a.ratio<1?"#4ade80":"#f87171"}}>{a.ratio<1?"negative split":"positive split"}</div>
                            </td>
                            <td style={{...S.td,textAlign:"center"}}>
                              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:3}}>
                                <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:11,color:"#638EB0"}}>{a.halfPos||"—"}</span>
                                <span style={{color:"#1e3a5f",fontSize:9}}>→</span>
                                <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:11,color:"#e2e8f0"}}>{a.finPos}</span>
                                {pd!==null&&pd!==0&&<span style={{fontSize:9,fontWeight:700,color:pd>0?"#22c55e":"#ef4444",marginLeft:2}}>{pd>0?`▲${pd}`:`▼${Math.abs(pd)}`}</span>}
                              </div>
                            </td>
                            <td style={{...S.td,textAlign:"center"}}>
                              <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:11,color:"#94a3b8"}}>{fmt(a.total)}</span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* ── SEGMENT ANALYSIS ──────────────────────────────────────── */}
          {tab==="segments"&&(
            <div className="fu">
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
                <p style={{...S.desc,marginBottom:0,flex:1}}>
                  Inter-checkpoint pace and {hasElev?"VAM (vertical metres/hour) for climbing segments. Elevation entered.":"climbing analysis. Add checkpoint elevations to identify climbing vs descending specialists."}
                </p>
                <button onClick={openElevEditor} style={{...S.btn,background:hasElev?"#1e3a5f":"#638EB0",flexShrink:0}}>
                  {hasElev?"✏ EDIT ELEVATION":"+ ADD ELEVATION"}
                </button>
              </div>

              {/* Athlete profile summary — only if elevation entered */}
              {hasElev&&athleteProfiles.length>0&&(
                <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:14,marginBottom:20}}>
                  {[
                    {title:"BEST CLIMBER",color:"#f97316",
                      ath:(()=>{const minSegs=segments.filter(s=>s.isClimb&&s.elevGain>20).length;const minCov=Math.max(1,Math.ceil(minSegs*0.5));return[...athleteProfiles].filter(a=>a.climbCount>=minCov).sort((a,b)=>(a.avgClimb??Infinity)-(b.avgClimb??Infinity))[0]??null;})(),
                      sub:"Lowest avg rank across uphill segments (min 50% of climbs)"},
                    {title:"BEST DESCENDER",color:"#22c55e",
                      ath:(()=>{const minSegs=segments.filter(s=>!s.isClimb&&s.elevLoss>20).length;const minCov=Math.max(1,Math.ceil(minSegs*0.5));return[...athleteProfiles].filter(a=>a.descCount>=minCov).sort((a,b)=>(a.avgDesc??Infinity)-(b.avgDesc??Infinity))[0]??null;})(),
                      sub:"Lowest avg rank across downhill segments (min 50% of descents)"},
                    {title:"CLIMBING BIASED",color:"#fb923c",
                      ath:athleteProfiles.length?athleteProfiles[0]:null,
                      sub:"Better avg rank on climbs than descents"},
                    {title:"DESCENDING BIASED",color:"#4ade80",
                      ath:athleteProfiles.length?athleteProfiles[athleteProfiles.length-1]:null,
                      sub:"Better avg rank on descents than climbs"},
                    {title:"MOST CONSISTENT",color:"#818cf8",
                      ath:athleteProfiles.length?athleteProfiles.reduce((b,a)=>Math.abs(a.profile)<Math.abs(b.profile)?a:b):null,
                      sub:"Avg climb rank closest to avg descent rank"},
                  ].map((c,i)=>(
                    <div key={i} style={{...S.card,borderLeft:`3px solid ${c.color}`}}>
                      <div style={{fontSize:9,color:"#334155",letterSpacing:"0.14em",marginBottom:5}}>{c.title}</div>
                      <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0",marginBottom:3}}>{c.ath?`${c.ath.firstName} ${c.ath.lastName}`:"—"}</div>
                      <div style={{fontSize:9,color:"#1e3a5f"}}>{c.sub}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Profile spectrum */}
              {hasElev&&athleteProfiles.length>0&&(
                <div style={{...S.card,marginBottom:18}}>
                  <div style={S.cardTitle}>
                    CLIMBER ↔ DESCENDER SPECTRUM
                    <span style={{fontWeight:400,fontSize:9,color:"#1e3a5f",marginLeft:8}}>based on relative performance on climbing vs descending segments</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,marginBottom:4,paddingRight:0}}>
                    <span style={{width:110}}/>
                    <div style={{flex:1}}/>
                    <span style={{width:70,fontSize:8,color:"#f97316",fontWeight:700,textAlign:"right",fontFamily:"JetBrains Mono,monospace"}}>↑ CLIMB</span>
                    <span style={{width:70,fontSize:8,color:"#22c55e",fontWeight:700,textAlign:"right",fontFamily:"JetBrains Mono,monospace"}}>↓ DESC</span>
                    <span style={{width:60,fontSize:8,color:"#1e3a5f",fontWeight:700}}>TYPE</span>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    {[...athleteProfiles].sort((a,b)=>a.profile-b.profile).map(a=>{
                      // profile <1 = climber, >1 = descender
                      // map to bar: 0=pure climber, 100=pure descender
                      const maxAdv=Math.max(...athleteProfiles.map(x=>Math.abs(x.profile)),1);
                      const pct=Math.min(Math.max(50-(a.profile/maxAdv)*48,2),98);
                      const col=a.profile>maxAdv*0.33?"#f97316":a.profile>0?"#fbbf24":a.profile>-maxAdv*0.33?"#86efac":"#22c55e";
                      const fmtGap=v=>v==null?"—":`#${v.toFixed(1)}`;
                      return(
                        <div key={a.id} style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{width:110,fontSize:10,color:"#334155",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textAlign:"right"}}>{a.lastName}, {a.firstName?.charAt(0)}</span>
                          <div style={{flex:1,height:14,background:"rgba(255,255,255,0.02)",borderRadius:3,overflow:"hidden",position:"relative"}}>
                            <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,#f97316,${col})`,borderRadius:3,minWidth:4}}/>
                            <div style={{position:"absolute",left:"50%",top:0,width:1,height:"100%",background:"rgba(99,142,176,0.25)"}}/>
                          </div>
                          <span style={{width:70,fontFamily:"JetBrains Mono,monospace",fontSize:8,color:"#f97316",fontWeight:700,textAlign:"right",whiteSpace:"nowrap"}}>↑{fmtGap(a.avgClimb)}</span>
                          <span style={{width:70,fontFamily:"JetBrains Mono,monospace",fontSize:8,color:"#22c55e",fontWeight:700,textAlign:"right",whiteSpace:"nowrap"}}>↓{fmtGap(a.avgDesc)}</span>
                          <span style={{width:60,fontSize:9,color:"#1e3a5f"}}>{a.profile>maxAdv*0.10?"climber":a.profile<-maxAdv*0.10?"descender":"all-round"}</span>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontSize:9,color:"#1e3a5f"}}>
                    <span>← Climber (faster uphill)</span><span>All-round</span><span>Descender (faster downhill) →</span>
                  </div>
                </div>
              )}

              {/* Per-segment breakdown */}
              <div style={{display:"flex",flexDirection:"column",gap:14}}>
                {segments.map((seg,si)=>{
                  const hasElevData=seg.elevGain!=null;
                  const isClimb=hasElevData&&seg.isClimb;
                  const sorted=[...seg.athletes].filter(a=>a.pace!=null).sort((a,b)=>a.pace-b.pace);
                  return(
                    <div key={si} style={{...S.card,borderLeft:`3px solid ${hasElevData?(isClimb?"#f97316":"#22c55e"):"#1e3a5f"}`}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
                        <div style={S.cardTitle}>
                          {seg.from} → {seg.to}
                          <span style={{color:hasElevData?(isClimb?"#f97316":"#22c55e"):"#334155",marginLeft:6}}>
                            {hasElevData?`↑${seg.elevGain}m ↓${seg.elevLoss}m`:""}
                          </span>
                        </div>
                        {seg.dist&&<span style={{fontSize:9,color:"#1e3a5f",fontFamily:"JetBrains Mono,monospace"}}>{seg.dist.toFixed(1)}km</span>}
                        {!hasElevData&&<span style={{fontSize:9,color:"#334155"}}>Add elevation to classify segment</span>}
                      </div>
                      <div style={S.tableWrap}>
                        <table style={{...S.table,fontSize:10}}>
                          <thead><tr>
                            <th style={{...S.th,minWidth:36}}>RNK</th>
                            <th style={{...S.th,minWidth:140,textAlign:"left"}}>ATHLETE</th>
                            <th style={{...S.th,minWidth:75}}>SEGMENT TIME</th>
                            <th style={{...S.th,minWidth:75}}>SPEED km/h</th>
                            {hasElevData&&isClimb&&seg.elevGain>20&&<th style={{...S.th,minWidth:75,color:"#f97316"}}>VAM m/h</th>}
                            <th style={{...S.th,minWidth:60}}>CP POS</th>
                          </tr></thead>
                          <tbody>
                            {sorted.map((a,ri)=>(
                              <tr key={a.id} className="row">
                                <td style={{...S.td,textAlign:"center"}}>
                                  <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:11,fontWeight:700,color:ri===0?"#fbbf24":ri===1?"#94a3b8":ri===2?"#b45309":"#1e3a5f"}}>{ri+1}</span>
                                </td>
                                <td style={S.td}><AthleteCell a={a}/></td>
                                <td style={{...S.td,textAlign:"center"}}>
                                  <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:11,color:"#94a3b8"}}>{fmt(a.segTime)}</span>
                                </td>
                                <td style={{...S.td,textAlign:"center"}}>
                                  <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:11,color:ri<3?"#22c55e":"#94a3b8"}}>{a.pace?(3600/a.pace).toFixed(1):"—"}</span>
                                </td>
                                {hasElevData&&isClimb&&seg.elevGain>20&&(
                                  <td style={{...S.td,textAlign:"center"}}>
                                    <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:11,color:ri<3?"#f97316":"#94a3b8"}}>{a.vam?Math.round(a.vam):"—"}</span>
                                  </td>
                                )}
                                <td style={{...S.td,textAlign:"center"}}>
                                  <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:10,color:"#334155"}}>
                                    {a.cpMap[seg.to]?.position||"—"}
                                  </span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

        </div>
      </>)}

      {!isLoading&&loadedCount===0&&phase!=="error"&&(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:60,gap:24}}>
          {phase==="idle"?(
            <div style={{color:"#1e3a5f",fontFamily:"Barlow Condensed,sans-serif",fontSize:16,letterSpacing:"0.1em"}}>LOADING…</div>
          ):(
            <>
              <div style={{color:"#638EB0",fontFamily:"Barlow Condensed,sans-serif",fontSize:13,letterSpacing:"0.12em"}}>ENTER A RACE ID ABOVE AND CLICK LOAD</div>
              <div style={{display:"flex",flexDirection:"column",gap:6,width:"100%",maxWidth:320}}>
                <div style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:10,letterSpacing:"0.14em",color:"#1e3a5f",marginBottom:4}}>PASS2PASS 2025 — AVAILABLE RACES</div>
                {[["Hundred","1367"],["Ultra","1368"],["Marathon","1369"],["Challenge","1370"],["Lite","1371"],["Dash","1372"]].map(([name,id])=>(
                  <div key={id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 12px",background:"rgba(30,58,95,0.18)",borderRadius:4,cursor:"pointer"}}
                    onClick={()=>{setRaceInput(id);setRaceId(parseInt(id));setElevation({});setCourseProfile([]);setCpDistances({});loadRace(parseInt(id),topN);}}>
                    <span style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:13,letterSpacing:"0.08em",color:"#e2e8f0"}}>{name}</span>
                    <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:10,color:"#638EB0"}}>ID {id}</span>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      <div style={{textAlign:"center",padding:10,fontSize:9,color:"#0a1828",letterSpacing:"0.08em",fontFamily:"JetBrains Mono,monospace",borderTop:"1px solid #060d18",marginTop:20}}>
        SPORTRAXS RACE INTELLIGENCE · PROXY: RACEANALYSER.DIDIER-B9A.WORKERS.DEV
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
